<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FaturaDefteri</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <section id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <h1>FaturaDefteri</h1>
      <p class="muted">Müşteri, fatura ve tahsilat</p>
      <p id="auth-error" class="auth-error"></p>
      <h2>Giriş</h2>
      <form id="login-form" class="form auth-form" action="/api/auth/login" method="post">
        <label class="full">E-posta <input name="email" type="email" required /></label>
        <label class="full">Şifre <input name="password" type="password" minlength="4" required /></label>
        <button type="submit" class="primary full">Giriş yap</button>
      </form>
      <h2>Kayıt ol</h2>
      <form id="register-form" class="form auth-form" action="/api/auth/register" method="post">
        <label class="full">E-posta <input name="email" type="email" required /></label>
        <label class="full">Şifre <input name="password" type="password" minlength="4" required /></label>
        <label class="full">Ad <input name="displayName" maxlength="200" /></label>
        <button type="submit" class="primary full">Kayıt ol</button>
      </form>
    </div>
  </section>

  <div id="app" class="hidden">
  <header class="top">
    <div>
      <h1>FaturaDefteri</h1>
      <p class="muted">Müşteri, fatura ve tahsilat</p>
    </div>
    <nav>
      <button type="button" data-view="dashboard" class="nav on">Özet</button>
      <button type="button" data-view="invoices">Faturalar</button>
      <button type="button" data-view="clients">Müşteriler</button>
      <button type="button" data-view="issuer">Firma</button>
      <button type="button" data-view="profile">Profil</button>
      <button type="button" id="btn-logout">Çıkış</button>
    </nav>
  </header>

  <main>
    <section id="view-dashboard" class="view">
      <div class="cards" id="summary-cards"></div>
      <h2>Aylık tahsilat</h2>
      <div id="monthly-chart" class="chart"></div>
      <h2>Son faturalar</h2>
      <div id="recent-invoices" class="table-wrap"></div>
    </section>

    <section id="view-invoices" class="view hidden">
      <div class="row-between">
        <h2>Faturalar</h2>
        <div style="display: flex; gap: 0.5rem;">
          <button type="button" id="btn-export-csv">CSV İndir</button>
          <button type="button" class="primary" id="btn-new-invoice">Yeni fatura</button>
        </div>
      </div>
      <div class="filters">
        <select id="filter-status">
          <option value="">Tümü</option>
          <option value="Draft">Taslak</option>
          <option value="Sent">Gönderildi</option>
          <option value="overdue">Gecikmiş</option>
          <option value="Paid">Ödendi</option>
          <option value="Cancelled">İptal</option>
        </select>
        <select id="filter-client"></select>
        <input type="date" id="filter-from-date" placeholder="Başlangıç" />
        <input type="date" id="filter-to-date" placeholder="Bitiş" />
        <button type="button" id="btn-clear-dates">Temizle</button>
      </div>
      <div id="invoice-table" class="table-wrap"></div>
    </section>

    <section id="view-clients" class="view hidden">
      <div class="row-between">
        <h2>Müşteriler</h2>
        <button type="button" class="primary" id="btn-new-client">Yeni müşteri</button>
      </div>
      <div id="client-table" class="table-wrap"></div>
    </section>

    <section id="view-issuer" class="view hidden">
      <h2>Firma bilgileri</h2>
      <p class="muted">Yazdırılan faturanın üstünde görünür.</p>
      <form id="issuer-form" class="form">
        <label>Unvan <input name="tradeName" required /></label>
        <label>Vergi dairesi <input name="taxOffice" /></label>
        <label>VKN / TCKN <input name="taxNumber" /></label>
        <label>E-posta <input name="email" type="email" /></label>
        <label>Telefon <input name="phone" /></label>
        <label>IBAN <input name="iban" /></label>
        <label>Para birimi
          <select name="currency" id="issuer-currency" required></select>
        </label>
        <label class="full">Adres <textarea name="address" rows="3"></textarea></label>
        <button type="submit" class="primary">Kaydet</button>
      </form>
    </section>

    <section id="view-profile" class="view hidden">
      <h2>Kullanıcı profili</h2>
      <div class="profile-section">
        <h3>Hesap bilgileri</h3>
        <form id="profile-form" class="form">
          <label>E-posta <input name="email" type="email" disabled /></label>
          <label>Ad <input name="displayName" required /></label>
          <button type="submit" class="primary">Güncelle</button>
        </form>
      </div>
      <div class="profile-section">
        <h3>Şifre değiştir</h3>
        <form id="password-form" class="form">
          <label>Mevcut şifre <input name="currentPassword" type="password" required /></label>
          <label>Yeni şifre <input name="newPassword" type="password" minlength="4" required /></label>
          <label>Yeni şifre (tekrar) <input name="confirmPassword" type="password" minlength="4" required /></label>
          <button type="submit" class="primary">Şifreyi değiştir</button>
        </form>
      </div>
    </section>

    <section id="view-editor" class="view hidden">
      <div class="row-between">
        <h2 id="editor-title">Yeni fatura</h2>
        <button type="button" id="btn-back-invoices">Listeye dön</button>
      </div>
      <form id="invoice-form" class="form">
        <label>Müşteri
          <select name="clientId" id="editor-client" required></select>
        </label>
        <label>Fatura tarihi <input name="issueDate" type="date" required /></label>
        <label>Vade <input name="dueDate" type="date" required /></label>
        <label class="full">Not <textarea name="notes" rows="2"></textarea></label>
        <div class="full">
          <div class="row-between">
            <h3>Kalemler</h3>
            <button type="button" id="btn-add-line">Kalem ekle</button>
          </div>
          <div id="lines"></div>
        </div>
        <div class="totals" id="editor-totals"></div>
        <div class="actions">
          <button type="submit" class="primary">Kaydet</button>
          <button type="button" id="btn-send" class="hidden">Gönderildi işaretle</button>
          <button type="button" id="btn-pay" class="hidden">Ödendi</button>
          <button type="button" id="btn-print" class="hidden">Yazdır</button>
          <button type="button" id="btn-cancel-inv" class="danger hidden">İptal</button>
          <button type="button" id="btn-delete-inv" class="danger hidden">Sil</button>
        </div>
      </form>
    </section>
  </main>
  </div>

  <dialog id="client-dialog">
    <form id="client-form" class="form">
      <h3 id="client-dialog-title">Müşteri</h3>
      <input type="hidden" name="id" />
      <label>Ad <input name="name" required /></label>
      <label>Vergi no <input name="taxNumber" /></label>
      <label>E-posta <input name="email" type="email" /></label>
      <label>Telefon <input name="phone" /></label>
      <label class="full">Adres <textarea name="address" rows="2"></textarea></label>
      <div class="actions">
        <button type="submit" class="primary">Kaydet</button>
        <button type="button" id="btn-client-close">Vazgeç</button>
      </div>
    </form>
  </dialog>

  <p id="toast" class="toast hidden"></p>
  <script src="/app.js?v=2"></script>
</body>
</html>
